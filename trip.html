<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan Your Trip - RideMate</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            🏍️ RideMate
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="trip.html">Plan Trip</a></li>
            <li><a href="#">Destinations</a></li>
            <li><a href="#">My Trips</a></li>
        </ul>

        <button class="login-btn">
            Login
        </button>

    </nav>


    <!-- Trip Planner -->

    <section class="planner">

        <h1>Plan Your Bike Trip</h1>

        <p>
            Enter your trip details and prepare for your ride.
        </p>


        <div class="planner-box">

            <div class="planner-input">

                <label>📍 Starting Point</label>

                <input
                    type="text"
                    id="tripStart"
                    placeholder="Example: Gazole"
                >

            </div>


            <div class="planner-input">

                <label>🏁 Destination</label>

                <input
                    type="text"
                    id="tripDestination"
                    placeholder="Example: Darjeeling"
                >

            </div>


            <div class="planner-input">

                <label>🏍️ Bike</label>

                <select id="bike">

                    <option value="">
                        Select your bike
                    </option>

                    <option value="NS200">
                        Bajaj Pulsar NS200
                    </option>

                    <option value="Classic350">
                        Royal Enfield Classic 350
                    </option>

                    <option value="Himalayan450">
                        Royal Enfield Himalayan 450
                    </option>

                    <option value="Duke390">
                        KTM Duke 390
                    </option>

                </select>

            </div>


            <div class="planner-input">

                <label>⛽ Mileage</label>

                <input
                    type="number"
                    id="mileage"
                    placeholder="Example: 38"
                >

                <small>km per litre</small>

            </div>


            <button
                class="calculate-btn"
                onclick="createTrip()"
            >
                CREATE TRIP
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
